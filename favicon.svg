<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="favicon-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Фоновый круг -->
  <circle cx="50" cy="50" r="45" fill="#1a1a2e" />
  
  <!-- Буква P -->
  <g filter="url(#favicon-glow)">
    <!-- Вертикальная линия -->
    <rect x="30" y="25" width="10" height="50" rx="2" fill="url(#favicon-grad)" />
    
    <!-- Верхняя дуга -->
    <path 
      d="M40 25 L55 25 Q68 25 68 40 Q68 55 55 55 L40 55" 
      stroke="url(#favicon-grad)" 
      stroke-width="10" 
      stroke-linecap="round"
      fill="none"
    />
    
    <!-- Центральная точка -->
    <circle cx="50" cy="50" r="3" fill="white" opacity="0.8" />
  </g>
</svg>